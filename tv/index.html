            }

          try {
            var origSetItem = window.localStorage.setItem.bind(window.localStorage);

                }

            }
          } catch (e) {}
        };

        hookStorage();

          var checkAttempts = 0;

              hookStorage();
            }
          }, 100);
        }

<script>
(function() {
  function getClearanceToken() {
    var token = "";
    try {
      var p = new URLSearchParams(window.location.search);
      token = p.get("cf_clearance") || p.get("clearance") || p.get("token") || "";
    } catch (e) {}

    if (!token && window.__cf_clearance_token) {
      token = window.__cf_clearance_token;
    }

    if (!token) {
      try {
        if (window.parent && window.parent !== window) {
          token = window.parent.__cf_clearance_token ||
                  window.parent.sessionStorage.getItem("cf_clearance_token") ||
                  window.parent.localStorage.getItem("cf_clearance_token") || "";
        }
      } catch (e) {}
    }

    if (!token) {
      try {
        token = sessionStorage.getItem("cf_clearance_token") || sessionStorage.getItem("cf_clearance") || "";
      } catch (e) {}
    }

    if (!token) {
      try {
        token = localStorage.getItem("cf_clearance_token") || localStorage.getItem("cf_clearance") || "";
      } catch (e) {}
    }

    if (!token) {
      try {
        var match = document.cookie.match(/(?:^|;\s*)cf_clearance=([^;]+)/);
        if (match) token = decodeURIComponent(match[1]);
      } catch (e) {}
    }

    if (token) {
      window.__cf_clearance_token = token;
      try { sessionStorage.setItem("cf_clearance_token", token); } catch (e) {}
      try { localStorage.setItem("cf_clearance_token", token); } catch (e) {}
    }

    return token;
  }

  window.getClearanceToken = getClearanceToken;

  function isClearanceTarget(url) {
    if (!url || typeof url !== "string") return false;
    // Strictly forbid clearance on stream proxies, CDNs, and media files
    if (
      url.includes("opg.yasuoyone.org") ||
      url.includes("cetin.cz") ||
      url.includes("mazana.tv") ||
      url.includes("aw-ucdn") ||
      url.includes(".m3u8") ||
      url.includes(".mpd") ||
      url.includes(".ts")
    ) {
      return false;
    }
    return (
      url.includes("e.yasuoyone.org") ||
      url.includes("oepg.yasuoyone.org") ||
      url.includes("epg.yasuoyone.org") ||
      url.includes("opevent.yasuoyone.org")
    );
  }

  window.isClearanceTarget = isClearanceTarget;

  window.attachClearance = function(url) {
    if (!url || typeof url !== "string") return url;
    // If by any chance url has cf_clearance on a stream, strip it immediately
    if (url.includes("opg.yasuoyone.org") || url.includes("cetin.cz") || url.includes("mazana.tv") || url.includes("aw-ucdn")) {
      return url.replace(/([?&])(cf_clearance|clearance)=[^&]*/g, '').replace(/\?&/, '?').replace(/&&+/, '&').replace(/[?&]$/, '');
    }
    if (!isClearanceTarget(url)) return url;
    var token = getClearanceToken();
    if (!token) return url;
    if (!url.includes("cf_clearance=") && !url.includes("clearance=") && !url.includes("token=")) {
      var sep = url.includes("?") ? "&" : "?";
      return url + sep + "cf_clearance=" + encodeURIComponent(token);
    }
    return url;
  };

  // Monkey-patch window.fetch to automatically include cf_clearance and X-Clearance-Token header ONLY for clearance workers
  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    var token = getClearanceToken();
    var url = typeof input === "string" ? input : (input && input.url ? input.url : "");

    if (typeof url === "string" && url.includes("cetin.cz")) {
      init = init || {};
      init.referrerPolicy = "no-referrer";
      init.referrer = "";
      if (init.headers) {
        if (typeof Headers !== "undefined" && init.headers instanceof Headers) {
          init.headers.delete("Referer");
          init.headers.delete("referer");
        } else if (Array.isArray(init.headers)) {
          init.headers = init.headers.filter(h => !/^referer$/i.test(h[0]));
        } else {
          delete init.headers["Referer"];
          delete init.headers["referer"];
        }
      }
    }

    if (token && isClearanceTarget(url)) {
      url = window.attachClearance(url);
      if (typeof input === "string") {
        input = url;
      } else if (typeof Request !== "undefined" && input instanceof Request) {
        input = new Request(url, input);
      }

      init = init || {};
      if (init.headers) {
        if (typeof Headers !== "undefined" && init.headers instanceof Headers) {
          if (!init.headers.has("X-Clearance-Token")) init.headers.set("X-Clearance-Token", token);
        } else if (Array.isArray(init.headers)) {
          init.headers.push(["X-Clearance-Token", token]);
        } else {
          init.headers["X-Clearance-Token"] = token;
        }
      } else {
        init.headers = { "X-Clearance-Token": token };
      }
    }

    return origFetch.call(this, input, init);
  };

  // Clean asynchronous sequential script loading
  function loadScriptAsync(src, callback) {
    var s = document.createElement("script");
    s.src = src;
    s.async = false;
    if (callback) s.onload = callback;
    document.head.appendChild(s);
  }
  var clr = getClearanceToken();
  var q = clr ? ("?cf_clearance=" + encodeURIComponent(clr)) : "";
  loadScriptAsync("https://e.yasuoyone.org/category.js" + q, function() {
    loadScriptAsync("https://e.yasuoyone.org/channels.js" + q);
  });

  // Resilient fallback retry
  setTimeout(function() {
    if (!window.channels || !window.channels.length) {
      var tok = getClearanceToken();
      var qk = tok ? ("?cf_clearance=" + encodeURIComponent(tok) + "&t=" + Date.now()) : ("?t=" + Date.now());
      var s1 = document.createElement("script");
      s1.src = "https://e.yasuoyone.org/category.js" + qk;
      s1.onload = function() {
        var s2 = document.createElement("script");
        s2.src = "https://e.yasuoyone.org/channels.js" + qk;
        document.head.appendChild(s2);
      };
      document.head.appendChild(s1);
    }
  }, 2500);
})();

    let lang = localStorage.getItem('tv_lang');

        const isCzOrSk = userLangs.some(l => {

        lang = isCzOrSk ? 'cs' : 'en';

    function t(k) { return (TR[lang] && TR[lang][k]) || (TR['cs'] && TR['cs'][k]) || k; }

    function trUI() {

    // Wrap/patch window.asC to resolve category mismatches and force movie channels to Filmy a seriály

        if (typeof originalAsC === 'function') {
            const cat = originalAsC(name);
            if (cat === 'Filmy') return 'Filmy a seriály';

const grid=document.getElementById('channels-grid');
const categoryContainer=document.getElementById('category-filters');
const searchInput=document.getElementById('channel-search');
const playerOverlay=document.getElementById('player-overlay');
const closePlayerBtn=document.getElementById('close-player-btn');
const playerChannelNameSpan=document.getElementById('player-channel-name');
const videoElem=document.getElementById('video');
const audioFallbackDiv=document.getElementById('audio-fallback');

// Sync volume from cache on initialization
const cachedVol = localStorage.getItem('player_volume');
if (cachedVol !== null) {
    videoElem.volume = parseFloat(cachedVol);
}
const cachedMuted = localStorage.getItem('player_muted');
if (cachedMuted !== null) {
    videoElem.muted = (cachedMuted === 'true');
}

// Track volume changes to update the cache
videoElem.addEventListener('volumechange', () => {
    localStorage.setItem('player_volume', videoElem.volume.toString());
    localStorage.setItem('player_muted', videoElem.muted ? 'true' : 'false');
});
const shakaContainer=document.getElementById('shaka-container');
const loadMoreBtn=document.getElementById('btn-load-more');
const loadMoreContainer=document.getElementById('load-more-container');

let allChannels=[];
let currentCategory='Všechny kanály';
let searchTerm='';
let renderedCount=0;
let shakaPlayer=null;
let shakaControls=null;
let currentAudioElement=null;
let currentChannelObj=null;
let currentStreamUrl = '';
let currentLoadId=0;

function getChannelCategory(channelName){return(typeof window.asC==='function')?window.asC(channelName):'Ostatní'}
function getFilteredChannels(){return allChannels.filter(ch=>{const catMatch=(currentCategory==='Všechny kanály'||getChannelCategory(ch.name)===currentCategory);const nameMatch=ch.name.toLowerCase().includes(searchTerm.toLowerCase());const idMatch=ch.id&&ch.id.toString().includes(searchTerm);return catMatch&&(nameMatch||idMatch)})}
function renderNextBatch(){const filtered=getFilteredChannels();const batchSize=30;const nextChunks=filtered.slice(renderedCount,renderedCount+batchSize);nextChunks.forEach(ch=>appendChannelCard(ch));renderedCount+=nextChunks.length;if(renderedCount>=filtered.length){loadMoreContainer.style.display='none'}else{loadMoreContainer.style.display='block'}}
let lastActiveCard=null;
function appendChannelCard(channel){
    const card=document.createElement('div');
    card.className='channel-card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', channel.name);
    card.innerHTML=`<img src="${channel.icon||''}" class="channel-logo" alt="${channel.name}" loading="lazy" decoding="async"><div class="channel-name">${channel.name}</div>`;
    card.addEventListener('click',()=>playChannel(channel, card));
    card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 23) {
            e.preventDefault();
            playChannel(channel, card);
        }
    });
    grid.appendChild(card);
}
function resetAndRender(){grid.innerHTML='';renderedCount=0;const filtered=getFilteredChannels();if(filtered.length===0){grid.innerHTML='<div class="empty-state"><i class="fas fa-tv" style="font-size:3rem; margin-bottom:1rem; display:block"></i>' + t('noChannels') + '</div>';loadMoreContainer.style.display='none';return}renderNextBatch()}

async function unloadShaka(){
    if (typeof TizenAVPlay !== 'undefined') {
        try { TizenAVPlay.stop(); } catch(e) {}
    }
    if(shakaPlayer){
        try{await shakaPlayer.unload()}catch(e){}
        try{await shakaPlayer.detach()}catch(e){}
    }
    videoElem.pause();
    videoElem.removeAttribute('src');
    videoElem.removeAttribute('poster');
    videoElem.poster='';
    videoElem.load();
}

async function initShakaOnce(){
    if(shakaPlayer)return shakaPlayer;
    if(!shaka.Player.isBrowserSupported()){alert(t('browserNotSupported'));return null}
    if(!videoElem._posterListenersAdded){
        videoElem._posterListenersAdded=true;
        videoElem.addEventListener('playing',()=>videoElem.removeAttribute('poster'));
        videoElem.addEventListener('loadeddata',()=>videoElem.removeAttribute('poster'));
        videoElem.addEventListener('canplay',()=>videoElem.removeAttribute('poster'));
    }
    let ui=videoElem['ui'];
    if(!ui){
        shakaPlayer=new shaka.Player(videoElem);
        ui=new shaka.ui.Overlay(shakaPlayer, shakaContainer, videoElem);
    }
    ui.configure({
        doubleClickForFullscreen: false,
        fadeDelay: 8,
        bigButtons: [],
        controlPanelElements: [
            'play_pause',
            'mute',
            'volume',
            'time_and_duration',
            'spacer',
            'overflow_menu',
            'fullscreen'
        ]
    });
    shakaControls=ui.getControls();
    shakaPlayer=shakaControls.getPlayer();
    shakaContainer.addEventListener('click',e=>{const t=e.target.closest('.shaka-current-time');if(t&&shakaPlayer.isLive())videoElem.currentTime=shakaPlayer.seekRange().end});
    
    // Intercept native fullscreen button click via capture listener on container to run our robust bypass toggle
    if (!shakaContainer._fsListenerAdded) {
        shakaContainer._fsListenerAdded = true;
        shakaContainer.addEventListener('click', (e) => {
            const fsBtn = e.target.closest('.shaka-fullscreen-button');
            if (fsBtn) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                toggleFullscreen(playerOverlay, videoElem);
            }
        }, true);
    }

    shakaPlayer.configure({
        streaming: {
            safeSeekOffset: 7,
            bufferingGoal: 10,
            rebufferingGoal: 2
        },
        manifest: {
            dash: { ignoreMinBufferTime: true, autoCorrectDrift: true }
        }
    });
    shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
        try {
            if (request && request.uris) {
                var isYasuoyone = request.uris.some(u => typeof u === "string" && (u.toLowerCase().includes(".yasuoyone.org") || u.toLowerCase().includes("yasuoyone.org")));
                if (isYasuoyone) {
                    request.headers = request.headers || {};
                    request.headers['Origin'] = 'https://yasuoyone.org';
                    request.headers['Referer'] = 'https://yasuoyone.org/';
                } else if (request.uris.some(u => typeof u === "string" && (u.toLowerCase().includes("cetin.cz") || u.toLowerCase().includes("mazana.tv") || u.toLowerCase().includes("aw-ucdn")))) {
                    if (request.headers) {
                        delete request.headers['Referer'];
                        delete request.headers['referer'];
                        delete request.headers['Referrer'];
                        delete request.headers['referrer'];
                        delete request.headers['Origin'];
                        delete request.headers['origin'];
                    }
                }
            }
            const token = (typeof getClearanceToken === "function") ? getClearanceToken() : "";
            if (token && request && request.uris) {
                for (let i = 0; i < request.uris.length; i++) {
                    let u = request.uris[i];
                    if (typeof isClearanceTarget === "function" && isClearanceTarget(u)) {
                        request.headers['X-Clearance-Token'] = token;
                    }
                }
            }

        } catch (e) {}
    });
    return shakaPlayer;
}

async function playChannel(channel, cardElem){
    if (cardElem) lastActiveCard = cardElem;
    currentChannelObj=channel;
    const loadId = ++currentLoadId;
    playerChannelNameSpan.textContent=channel.name;
    playerOverlay.classList.add('active');
    if (typeof showControls === 'function') showControls();
    document.body.style.overflow='hidden';
    
    if(currentAudioElement){
        currentAudioElement.pause();
        currentAudioElement.removeAttribute('src');
        currentAudioElement.load();
        currentAudioElement=null;
    }
    audioFallbackDiv.style.display='none';
    shakaContainer.style.display='block';
    videoElem.removeAttribute('poster');
    videoElem.poster='';
    
    await unloadShaka();
    if (loadId !== currentLoadId) return;
    
    let modifiedStreamUrl = '';
    const isRadio = channel.name.toLowerCase().includes('radio') || channel.name.toLowerCase().includes('fm');
    try {
        const res = await fetch(`https://e.yasuoyone.org/api/get-stream?id=${encodeURIComponent(channel.name)}`);
        if (loadId !== currentLoadId) return;
        const data = await res.json();
        if (!data.stream) throw new Error('Stream not found');
        
        const streamRes = await fetch(`https://e.yasuoyone.org${data.stream}`);
        if (loadId !== currentLoadId) return;
        const streamUrl = (await streamRes.text()).trim();
        
        if (isRadio) throw new Error('audio_fallback');
        
        await initShakaOnce();
        if (loadId !== currentLoadId) return;
        
        modifiedStreamUrl = streamUrl.replace(/([?&])(cf_clearance|clearance)=[^&]*/g, '').replace(/\?&/, '?').replace(/&&+/, '&').replace(/[?&]$/, '');
        try {
            if (modifiedStreamUrl.includes('cetin.cz')) {
                const vEl = document.getElementById('video');
                if (vEl) {
                    vEl.setAttribute('referrerpolicy', 'no-referrer');
                    try { vEl.referrerPolicy = 'no-referrer'; } catch (e) {}
                }
            }
        } catch (urlErr) {
            console.warn('URL modifying error:', urlErr);
        }

        currentStreamUrl = modifiedStreamUrl;

        // Samsung TV AVPlay native playback (CORS-free, hardware MPEG-TS)
        if (typeof TizenAVPlay !== 'undefined' && TizenAVPlay.isAvailable()) {
            console.log('[TV Index] Routing through Samsung AVPlay:', modifiedStreamUrl);
            shakaContainer.style.display = 'block';
            videoElem.style.display = 'none';
            TizenAVPlay.play(modifiedStreamUrl, {
                containerEl: shakaContainer,
                onPlaying: function() {
                    console.log('[TV Index] AVPlay started playing successfully');
                },
                onError: function(errType) {
                    console.warn('[TV Index] AVPlay error:', errType, 'falling back to Shaka');
                    try { TizenAVPlay.stop(); } catch(e){}
                    videoElem.style.display = '';
                    initShakaOnce().then(function(sp) {
                        if (sp) {
                            sp.load(modifiedStreamUrl).then(function() {
                                videoElem.play().catch(function() {});
                            }).catch(function(shakaErr) {
                                console.error('Shaka fallback also failed:', shakaErr);
                            });
                        }
                    });
                }
            });
            return;
        }

        console.log('Attempting to load stream into Shaka:', modifiedStreamUrl);
        await shakaPlayer.load(modifiedStreamUrl);
        console.log('Shaka stream loaded successfully!');
        
        if (loadId !== currentLoadId) return;
        
        try {
            await videoElem.play();
        } catch (playErr) {
            console.warn('videoElem.play() unmuted failed, trying muted:', playErr);
            videoElem.muted = true;
            await videoElem.play();
        }

        // Fallback timer removed - Shaka Player with mux.js manages MSE decoding directly
    } catch (err) {
        console.error('CRITICAL: playChannel failed in Shaka:', err);
        if (loadId !== currentLoadId) return;
        if (!isRadio && modifiedStreamUrl) {
            try {
                console.log('Attempting native direct video playback failover:', modifiedStreamUrl);
                await unloadShaka();
                var playUrl = (window.__wrapWithProxy && window.__TB_PROXY_ACTIVE__) ? window.__wrapWithProxy(modifiedStreamUrl) : modifiedStreamUrl;
                videoElem.src = playUrl;
                videoElem.load();
                await videoElem.play();
                return;
            } catch (nativeErr) {
                console.warn('Native video failover also failed:', nativeErr);
            }
        }
        shakaContainer.style.display = 'none';
        audioFallbackDiv.style.display = 'flex';
        const audioElem = audioFallbackDiv.querySelector('audio');
        audioElem.removeAttribute('src');
        audioElem.load();
        
        try{
            const audioRes=await fetch(`https://e.yasuoyone.org/api/get-stream?id=${encodeURIComponent(channel.name)}`);
            if (loadId !== currentLoadId) return;
            const audioData=await audioRes.json();
            
            if(audioData.stream){
                const audioStreamRes=await fetch(`https://e.yasuoyone.org${audioData.stream}`);
                if (loadId !== currentLoadId) return;
                const audioUrl=(await audioStreamRes.text()).trim();
                if (audioUrl.includes('cetin.cz')) {
                    audioElem.setAttribute('referrerpolicy', 'no-referrer');
                }
                audioElem.src=audioUrl;
                currentAudioElement=audioElem;
                const cachedVol = localStorage.getItem('player_volume');
                if (cachedVol !== null) {
                    audioElem.volume = parseFloat(cachedVol);
                }
                const cachedMuted = localStorage.getItem('player_muted');
                if (cachedMuted !== null) {
                    audioElem.muted = (cachedMuted === 'true');
                }
                audioElem.onvolumechange = () => {
                    localStorage.setItem('player_volume', audioElem.volume.toString());
                    localStorage.setItem('player_muted', audioElem.muted ? 'true' : 'false');
                };
                await audioElem.play();
            }else{
                throw new Error('No audio stream');
            }
        }catch(audioErr){
            if (loadId !== currentLoadId) return;
            audioFallbackDiv.innerHTML=`<div style="color:#ff8888"><i class="fas fa-exclamation-triangle"></i> ${t('streamUnavailable')}</div>`;
        }
    }
}

async function closePlayer(){
    if (typeof TizenAVPlay !== 'undefined') {
        try { TizenAVPlay.stop(); } catch(e) {}
    }
    var qPopup = document.getElementById('tv-quality-popup');
    if (qPopup) qPopup.classList.add('hidden');
    if (typeof window.AndroidNative !== "undefined" && window.AndroidNative.setFullscreen) {
        try { window.AndroidNative.setFullscreen(false); } catch (e) {}
    }
    if (window.self !== window.top) {
        try { window.parent.postMessage({ type: "setFullscreen", fullscreen: false }, "*"); } catch (e) {}
    }
    try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        if (window.self !== window.top && window.parent && window.parent.document) {
            if (window.parent.document.fullscreenElement || window.parent.document.webkitFullscreenElement) {
                if (window.parent.document.exitFullscreen) window.parent.document.exitFullscreen();
                else if (window.parent.document.webkitExitFullscreen) window.parent.document.webkitExitFullscreen();
            }
        }
    } catch(e) {}
    currentLoadId++; // Cancel ongoing loads
    playerOverlay.classList.remove('active');
    playerOverlay.classList.remove('controls-hidden');
    if (typeof controlsTimeout !== 'undefined') clearTimeout(controlsTimeout);
    document.body.style.overflow='';
    
    if(currentAudioElement){
        currentAudioElement.pause();
        currentAudioElement.removeAttribute('src');
        currentAudioElement.load();
        currentAudioElement=null;
    }
    
    await unloadShaka();
    audioFallbackDiv.style.display='none';
    shakaContainer.style.display='block';
    currentChannelObj=null;
    if (lastActiveCard && typeof lastActiveCard.focus === 'function') {
        try { lastActiveCard.focus(); } catch (e) {}
    }
}
window.closePlayer = closePlayer;

function toggleFullscreen(container, videoElement) {
    let targetEl = container;
    let targetDoc = document;
    let isEmbedded = window.self !== window.top;
    
    if (isEmbedded) {
        try {
            const parentIframes = window.parent.document.querySelectorAll("iframe");
            for (let i = 0; i < parentIframes.length; i++) {
                if (parentIframes[i].contentWindow === window.self) {
                    targetEl = parentIframes[i];
                    targetDoc = window.parent.document;
                    break;
                }
            }
        } catch (e) {
            console.warn("Cross-origin or parent access blocked:", e);
        }
    }

    const isFs = !!(targetDoc.fullscreenElement || 
                    targetDoc.webkitFullscreenElement || 
                    targetDoc.mozFullScreenElement || 
                    targetDoc.msFullscreenElement ||
                    document.fullscreenElement || 
                    document.webkitFullscreenElement || 
                    document.mozFullScreenElement || 
                    document.msFullscreenElement);

    if (!isFs) {
        // Enter fullscreen
        const requestFS = (el) => {
            if (el.requestFullscreen) return el.requestFullscreen();
            else if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) return el.msRequestFullscreen();
            return Promise.reject("Not supported");
        };

        requestFS(targetEl).then(() => {
            updateFullscreenButton();
        }).catch(err => {
            console.warn("Fullscreen request on target failed, trying local container:", err);
            // Fallback to local container if parent fails
            if (container.requestFullscreen) {
                container.requestFullscreen().then(() => updateFullscreenButton()).catch(e => enterNativeFullscreen(videoElement));
            } else {
                enterNativeFullscreen(videoElement);
            }
        });
    } else {
        // Exit fullscreen
        const exitFS = (doc) => {
            if (doc.exitFullscreen) return doc.exitFullscreen();
            else if (doc.webkitExitFullscreen) return doc.webkitExitFullscreen();
            else if (doc.mozCancelFullScreen) return doc.mozCancelFullScreen();
            else if (doc.msExitFullscreen) return doc.msExitFullscreen();
        };

        try {
            if (targetDoc.fullscreenElement || targetDoc.webkitFullscreenElement) {
                exitFS(targetDoc);
            }
        } catch (err) {}
        try {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                exitFS(document);
            }
        } catch (e) {}
        setTimeout(updateFullscreenButton, 100);
    }
}

function enterNativeFullscreen(videoElement) {
    if (videoElement.webkitEnterFullscreen) {
        try {
            videoElement.webkitEnterFullscreen();
        } catch (e) {
            console.warn("webkitEnterFullscreen failed:", e);
        }
    } else if (videoElement.requestFullscreen) {
        videoElement.requestFullscreen().catch(err => {
            console.warn("videoElement.requestFullscreen failed:", err);
        });
    } else {
        alert(t('browserNotSupported'));
    }
}

function updateFullscreenButton() {
    const isFs = !!(document.fullscreenElement || 
                 document.webkitFullscreenElement || 
                 document.mozFullScreenElement || 
                 document.msFullscreenElement ||
                 (() => {
                     try {
                         return window.self !== window.top && 
                                (window.parent.document.fullscreenElement || 
                                 window.parent.document.webkitFullscreenElement || 
                                 window.parent.document.mozFullScreenElement || 
                                 window.parent.document.msFullscreenElement);
                     } catch(e) { return false; }
                 })());
                 
    if (typeof window.AndroidNative !== "undefined" && window.AndroidNative.setFullscreen) {
        try { window.AndroidNative.setFullscreen(isFs); } catch (e) {}
    }
    if (window.self !== window.top) {
        try { window.parent.postMessage({ type: "setFullscreen", fullscreen: isFs }, "*"); } catch (e) {}
    }

    const shakaFsBtn = shakaContainer ? shakaContainer.querySelector('.shaka-fullscreen-button') : null;
    if (shakaFsBtn) {
        shakaFsBtn.textContent = isFs ? 'fullscreen_exit' : 'fullscreen';
        shakaFsBtn.setAttribute('aria-label', isFs ? 'Ukončit celou obrazovku' : 'Celá obrazovka');
        shakaFsBtn.classList.add('material-icons-round');
    }
}

document.addEventListener('fullscreenchange', updateFullscreenButton);
document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
document.addEventListener('mozfullscreenchange', updateFullscreenButton);
document.addEventListener('MSFullscreenChange', updateFullscreenButton);

try {
    if (window.self !== window.top && window.parent && window.parent.document) {
        window.parent.document.addEventListener('fullscreenchange', updateFullscreenButton);
        window.parent.document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
    }
} catch (e) {}

window.addEventListener('message', (e) => {
    if (e.data && (e.data.type === 'fullscreenchange' || e.data.type === 'setFullscreen')) {
        setTimeout(updateFullscreenButton, 50);
    }
});

            e.preventDefault();
            toggleFullscreen(playerOverlay, videoElem);
        }
        lastTap = currentTime;
    });
}

var controlsTimeout;
var isHoveringHeader = false;

var ctrlBtnPlayPause = document.getElementById('ctrl-btn-playpause');
var ctrlBtnQuality = document.getElementById('ctrl-btn-quality');
var ctrlBtnStop = document.getElementById('ctrl-btn-stop');
var ctrlPlayPauseText = document.getElementById('ctrl-playpause-text');
var ctrlQualityLabel = document.getElementById('ctrl-quality-label');
var tvQualityPopup = document.getElementById('tv-quality-popup');
var tvQualityList = document.getElementById('tv-quality-list');
var playerSourceInfo = document.getElementById('player-source-info');

function togglePlayPause() {
    if (typeof TizenAVPlay !== 'undefined' && TizenAVPlay.isAvailable() && TizenAVPlay.getCurrentUrl()) {
        TizenAVPlay.togglePlayPause();
        var isPl = TizenAVPlay.isPlaying();
        if (ctrlBtnPlayPause) {
            ctrlBtnPlayPause.innerHTML = isPl ? '<i class="fas fa-pause"></i> <span id="ctrl-playpause-text">Pauza</span>' : '<i class="fas fa-play"></i> <span id="ctrl-playpause-text">Přehrát</span>';
        }
    } else if (videoElem) {
        if (videoElem.paused) {
            videoElem.play().catch(function(){});
            if (ctrlBtnPlayPause) ctrlBtnPlayPause.innerHTML = '<i class="fas fa-pause"></i> <span id="ctrl-playpause-text">Pauza</span>';
        } else {
            videoElem.pause();
            if (ctrlBtnPlayPause) ctrlBtnPlayPause.innerHTML = '<i class="fas fa-play"></i> <span id="ctrl-playpause-text">Přehrát</span>';
        }
    }
}

function toggleQualityMenu() {
    if (!tvQualityPopup) return;
    if (!tvQualityPopup.classList.contains('hidden')) {
        tvQualityPopup.classList.add('hidden');
        if (ctrlBtnQuality) ctrlBtnQuality.focus();
        return;
    }
    tvQualityList.innerHTML = '';
    var tracks = [];
    if (typeof TizenAVPlay !== 'undefined' && TizenAVPlay.isAvailable() && typeof TizenAVPlay.getVideoTracks === 'function') {
        tracks = TizenAVPlay.getVideoTracks();
    }
    
    // Auto quality option
    var autoBtn = document.createElement('button');
    autoBtn.className = 'tv-q-item active';
    autoBtn.setAttribute('tabindex', '0');
    autoBtn.innerHTML = '<i class="fas fa-check" style="margin-right:6px"></i> Automatická kvalita (HW)';
    autoBtn.onclick = function() {
        if (ctrlQualityLabel) ctrlQualityLabel.textContent = 'Kvalita (Auto)';
        tvQualityPopup.classList.add('hidden');
        if (ctrlBtnQuality) ctrlBtnQuality.focus();
    };
    autoBtn.onkeydown = function(ev) {
        if (ev.keyCode === 13 || ev.key === 'Enter') { ev.preventDefault(); autoBtn.click(); }
    };
    tvQualityList.appendChild(autoBtn);

    if (tracks && tracks.length) {
        tracks.forEach(function(tr) {
            var btn = document.createElement('button');
            btn.className = 'tv-q-item';
            btn.setAttribute('tabindex', '0');
            btn.textContent = tr.label || ('Stopa ' + tr.index);
            btn.onclick = function() {
                if (typeof TizenAVPlay !== 'undefined' && typeof TizenAVPlay.setVideoTrack === 'function') {
                    TizenAVPlay.setVideoTrack(tr.index);
                }
                if (ctrlQualityLabel) ctrlQualityLabel.textContent = tr.label;
                tvQualityPopup.classList.add('hidden');
                if (ctrlBtnQuality) ctrlBtnQuality.focus();
            };
            btn.onkeydown = function(ev) {
                if (ev.keyCode === 13 || ev.key === 'Enter') { ev.preventDefault(); btn.click(); }
            };
            tvQualityList.appendChild(btn);
        });
    }

    tvQualityPopup.classList.remove('hidden');
    autoBtn.focus();
}

if (ctrlBtnPlayPause) ctrlBtnPlayPause.onclick = togglePlayPause;
if (ctrlBtnQuality) ctrlBtnQuality.onclick = toggleQualityMenu;
if (ctrlBtnStop) ctrlBtnStop.onclick = closePlayer;

function showControls(focusTarget) {
    playerOverlay.classList.remove('controls-hidden');
    clearTimeout(controlsTimeout);
    if (playerOverlay.classList.contains('active') && audioFallbackDiv.style.display !== 'flex') {
        controlsTimeout = setTimeout(hideControls, 6000);
    }
    if (focusTarget && typeof focusTarget.focus === 'function') {
        try { focusTarget.focus(); } catch (e) {}
    }
}

function hideControls() {
    if (playerOverlay.classList.contains('active') && !isHoveringHeader && audioFallbackDiv.style.display !== 'flex') {
        if (tvQualityPopup && !tvQualityPopup.classList.contains('hidden')) {
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(hideControls, 6000);
            return;
        }
        playerOverlay.classList.add('controls-hidden');
    }
}

const playerHeader = playerOverlay.querySelector('.player-header');
if (playerHeader) {
    playerHeader.addEventListener('mouseenter', () => {
        isHoveringHeader = true;
        showControls();
    });
    playerHeader.addEventListener('mouseleave', () => {
        isHoveringHeader = false;
        showControls();
    });
}

playerOverlay.addEventListener('mousemove', () => showControls());
playerOverlay.addEventListener('touchstart', () => showControls(), { passive: true });
playerOverlay.addEventListener('pointermove', () => showControls());
playerOverlay.addEventListener('click', () => showControls());

videoElem.addEventListener('play', () => {

videoElem.addEventListener('pause', () => {

// TV Remote & Keyboard Controls
window.addEventListener('keydown', (e) => {
    var isBack = e.key === 'Escape' || e.keyCode === 27 || e.keyCode === 4 || e.keyCode === 10009 || e.key === 'Back' || e.key === 'XF86Back';
    if (playerOverlay.classList.contains('active')) {
        // Back / Escape closes quality menu if open, or closes player cleanly
        if (isBack) {
            e.preventDefault();
            e.stopPropagation();
            if (tvQualityPopup && !tvQualityPopup.classList.contains('hidden')) {
                tvQualityPopup.classList.add('hidden');
                if (ctrlBtnQuality) ctrlBtnQuality.focus();
                return;
            }
            closePlayer();
            return;
        }

        // Space / MediaPlayPause toggles playback
        if (e.keyCode === 32 || e.keyCode === 179 || e.keyCode === 10252) {
            e.preventDefault();
            e.stopPropagation();
            togglePlayPause();
            showControls();
            return;
        }

        // If controls were hidden, ANY key wakes them up and focuses the close button or controls
        var isHidden = playerOverlay.classList.contains('controls-hidden');
        if (isHidden) {
            e.preventDefault();
            e.stopPropagation();
            showControls(closePlayerBtn || ctrlBtnPlayPause);
            return;
        } else {
            // Controls visible: keep timer alive
            showControls();
        }

        // Up arrow: focus close button at top
        if (e.keyCode === 38) {
            if (closePlayerBtn && document.activeElement !== closePlayerBtn) {
                closePlayerBtn.focus();
                return;
            }
        }
        // Down arrow: focus controls at bottom
        if (e.keyCode === 40) {
            if (ctrlBtnPlayPause && document.activeElement === closePlayerBtn) {
                ctrlBtnPlayPause.focus();
                return;
            }
        }
    } else {
        if (isBack) {
            e.preventDefault();
            e.stopPropagation();
            window.goBackToRozcestnik(e);
            return;
        }
    }
});
