    <aside class="sidebar">
        <div class="logo"><span class="material-icons-round">play_circle_filled</span></div>
        <div class="channel-list" id="channel-list"></div>
    </aside>

    <main class="main-content">
        <div class="player-area">
            <div id="shaka-container" style="position: relative; width: 100%; height: 100%; z-index: 1;">
                <div class="video-container" data-shaka-player-container style="width:100%; aspect-ratio:16/9; max-height:60vh; margin:0 auto;">
                    <video autoplay muted playsinline data-shaka-player id="video" style="width:100%;height:100%"></video>
                </div>
            </div>
            <div id="iframe-container" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1;">
                <iframe id="embed-player" allowfullscreen allow="encrypted-media" style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>

        <div class="epg-panel">
            <div class="current-program-card">
                <div class="channel-label">
                    <span class="material-icons-round" style="font-size:1.2rem">live_tv</span>
                    <span id="channel-name-display">Vyberte kanál</span>
                </div>
                <h1 class="program-title" id="program-title">Načítání...</h1>
                <div class="program-meta">
                    <span id="program-genre">Sport</span>
                    <span style="width: 4px; height: 4px; background: currentColor; border-radius: 50%;"></span>
                    <span id="program-status">LIVE</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="program-progress"></div>
                    </div>
                    <div class="time-labels">
                        <span id="start-time">--:--</span>
                        <span id="end-time">--:--</span>
                    </div>
                </div>
                <p class="description" id="program-desc">Vyberte ikonu kanálu v levém menu pro spuštění přehrávání.</p>
            </div>
        </div>
    </main>

    <script>(function(){if(typeof shaka!=='undefined'&&shaka.Player&&!shaka.Player._patched){const oC=shaka.Player.prototype.configure;shaka.Player.prototype.configure=function(c,v){if(typeof c==='object'){if(c.preferredAudioLanguage===undefined||c.preferredAudioLanguage===""||c.preferredAudioLanguage==="en"||c.preferredAudioLanguage==="eng")c.preferredAudioLanguage='en';}else if(typeof c==='string'&&c==='preferredAudioLanguage'){if(!v||v==='en'||v==='eng')v='en';}return oC.call(this,c,v);};const oL=shaka.Player.prototype.load;shaka.Player.prototype.load=function(){const curr=this.getConfiguration().preferredAudioLanguage;if(!curr||curr==='en'||curr==='eng')this.configure({preferredAudioLanguage:'en'});if(!this._langFallbackRegistered){this._langFallbackRegistered=true;this.addEventListener('trackschanged',()=>{try{const tracks=this.getVariantTracks?this.getVariantTracks():[];if(!tracks||!tracks.length)return;const hasEn=tracks.some(t=>t.language&&t.language.toLowerCase().startsWith('en'));if(!hasEn){const cs=tracks.find(t=>t.language&&(t.language.toLowerCase().startsWith('cs')||t.language.toLowerCase().startsWith('cz')));if(cs){const curr=this.getConfiguration().preferredAudioLanguage;if(!curr||(!curr.toLowerCase().startsWith('cs')&&!curr.toLowerCase().startsWith('cz'))){this.configure({preferredAudioLanguage:cs.language});}}}}catch(e){console.warn("Lang fallback error:",e);}});}return oL.apply(this,arguments);};shaka.Player._patched=true;}})();</script>

            { id: "557", name: "Oneplay Sport MD8", icon: "https://eboxcz-ott-images.ssl.cdn.cra.cz/rxn/92d3b1e5-b84e-43cd-b1d3-5136bda72081", url: "https://opg.yasuoyone.org/Oneplay%20Sport%20MD8.m3u8" },
            { name: "JOJ ŠPORT", icon: "https://static.rebit.sk/tv-brand/joj-sport.png", url: "https://ts0-pl.artos.4net.tv/hls/master/live.m3u8?channel=2164&device=d3f8ad0f6a2f75710d8113664b825283&stream_profiles=h264hd11,h264hd12,h264hd13&shaping=0&eta=1&ets=1" },
            { name: "JOJ ŠPORT 2", icon: "https://iptv.bbxnet.sk/stalker_portal/misc/logos/320/3100.png?26615", url: "https://ts0-pl.artos.4net.tv/hls/master/live.m3u8?channel=2423&device=d3f8ad0f6a2f75710d8113664b825283&stream_profiles=h264hd11,h264hd13&shaping=0&eta=1&ets=1" },
        ];

        const channelIdMapping = {
            "Nova Sport 1 HD": "Nova Sport 1",
            "Nova Sport 2 HD": "Nova Sport 2",
            "Nova Sport 3 HD": "Nova Sport 3",
            "Nova Sport 4 HD": "Nova Sport 4",
            "Nova Sport 5 HD": "Nova Sport 5",
            "Nova Sport 6 HD": "Nova Sport 6",
            "ČT Sport HD": "ČT Sport",
            "Eurosport HD": "Eurosport",
            "Eurosport 2 HD": "Eurosport 2"
        };
        
        const TR = {
            cs: {
                selectChannel: "Vyberte kanál",
                loading: "Načítání...",
                noProgram: "Informace o programu nejsou k dispozici.",
                selectChannelToPlay: "Vyberte ikonu kanálu v levém menu pro spuštění přehrávání.",
                showMdChannels: "Zobrazit MD Kanály",
                notSupported: "Váš prohlížeč není podporován.",
                streamError: "Chyba při načítání streamu:",
                sport: "Sport",
                live: "LIVE"
            },
            en: {
                selectChannel: "Select Channel",
                loading: "Loading...",
                noProgram: "No program information available.",
                selectChannelToPlay: "Select a channel icon from the left menu to start playback.",
                showMdChannels: "Show MD Channels",
                notSupported: "Your browser is not supported.",
                streamError: "Error loading stream:",
                sport: "Sport",
                live: "LIVE"
            }
        };

        let lang = localStorage.getItem('tv_lang');
        if (!lang) {
            const userLangs = navigator.languages || [navigator.language || ''];
            const isCzOrSk = userLangs.some(l => {
                const low = l.toLowerCase();
                return low.startsWith('cs') || low.startsWith('sk');
            });
            lang = isCzOrSk ? 'cs' : 'en';
        }

        function t(key) {
            return (TR[lang] && TR[lang][key]) || (TR['en'] && TR['en'][key]) || key;
        }

        function applyLocalization() {
            document.documentElement.lang = lang;
            const channelNameDisplay = document.getElementById("channel-name-display");
            if (channelNameDisplay && (channelNameDisplay.innerText === "Vyberte kanál" || channelNameDisplay.innerText === "Select Channel")) {
                channelNameDisplay.innerText = t("selectChannel");
            }
            const programTitle = document.getElementById("program-title");
            if (programTitle && (programTitle.innerText === "Načítání..." || programTitle.innerText === "Loading...")) {
                programTitle.innerText = t("loading");
            }
            const programGenre = document.getElementById("program-genre");
            if (programGenre) programGenre.innerText = t("sport");
            const programStatus = document.getElementById("program-status");
            if (programStatus) programStatus.innerText = t("live");
            const programDesc = document.getElementById("program-desc");
            if (programDesc && (programDesc.innerText.includes("Vyberte ikonu kanálu") || programDesc.innerText.includes("Select a channel icon"))) {
                programDesc.innerText = t("selectChannelToPlay");
            }
        }

        let epgData = {};
        let activeChannel = null;
        let currentStreamUrl = "";

        async function initApp() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) { alert(t("notSupported")); return }
            applyLocalization();
            const video = document.getElementById("video");
            const ui = video.ui;
            const controls = ui.getControls();
            window.player = controls.getPlayer();
            player.addEventListener("error", onErrorEvent);
            player.configure({
                manifest: { availabilityWindowOverride: 14400 },
                streaming: { bufferingGoal: 10, rebufferingGoal: 2, liveSync: { enabled: false } }
            });
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                try {
                    if (currentStreamUrl) {
                        const masterUrl = new URL(currentStreamUrl);
                        request.uris.forEach((uri, idx) => {
                            const reqUrl = new URL(uri);
                            if (reqUrl.host === masterUrl.host) {
                                masterUrl.searchParams.forEach((val, key) => {
                                    if (!reqUrl.searchParams.has(key)) {
                                        reqUrl.searchParams.set(key, val);
                                    }
                                });
                                request.uris[idx] = reqUrl.toString();
                            }
                        });
                    }
                } catch (e) {}
            });

            // Explicitly configure Shaka UI controls to ensure fullscreen is enabled
            ui.configure({
                controlPanelElements: [
                    'play_pause',
                    'time_and_duration',
                    'mute',
                    'volume',
                    'spacer',
                    'fullscreen',
                    'overflow_menu'
                ],
                addBigPlayButton: true,
                addContextMenu: true
            });

            // Double-click/tap to toggle fullscreen with robust fallbacks (great for iOS/Safari/iFrames)
            const videoContainer = document.querySelector('.video-container');
            if (videoContainer) {
                videoContainer.addEventListener('dblclick', () => {
                    toggleFullscreen(videoContainer, video);
                });
                // Support mobile double tap
                let lastTap = 0;
                videoContainer.addEventListener('touchend', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 300 && tapLength > 0) {
                        e.preventDefault();
                        toggleFullscreen(videoContainer, video);
                    }
                    lastTap = currentTime;
                });
            }

            renderChannels(channels);
            fetchEPG();
        }

        // Fullscreen toggle logic with multiple fallbacks
        function toggleFullscreen(container, videoElement) {
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.mozFullScreenElement && 
                !document.msFullscreenElement) {
                
                // Enter fullscreen
                if (container.requestFullscreen) {
                    container.requestFullscreen().catch(err => {
                        console.warn("Container requestFullscreen blocked, trying video native element fullscreen:", err);
                        enterNativeFullscreen(videoElement);
                    });
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.mozRequestFullScreen) {
                    container.mozRequestFullScreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                } else {
                    enterNativeFullscreen(videoElement);
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        function enterNativeFullscreen(videoElement) {
            if (videoElement.webkitEnterFullscreen) {
                // iOS iPhone native video fullscreen fallback
                videoElement.webkitEnterFullscreen();
            } else if (videoElement.requestFullscreen) {
                videoElement.requestFullscreen();
            } else {
                alert("Fullscreen is not supported on this device/browser.");
            }
        }

        function createChannelElement(ch) {
            const item = document.createElement("div");
            item.className = `channel-item ${activeChannel === ch ? "active" : ""}`;
            item.onclick = () => loadChannel(ch, item);
            item.setAttribute("data-name", ch.name);
            item.innerHTML = `<img src="${ch.icon}" class="channel-icon" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/40'">`;
            return item;
        }

        function renderChannels(list) {
            const container = document.getElementById("channel-list");
            container.innerHTML = "";
            const mainChannels = list.filter(c => !c.isMD);
            const mdChannels = list.filter(c => c.isMD);
            mainChannels.forEach(ch => {
                container.appendChild(createChannelElement(ch));
                if (ch.name === "Oneplay Sport 4" && mdChannels.length > 0) {
                    const toggle = document.createElement("div");
                    toggle.className = "md-group-toggle";
                    toggle.innerHTML = "MD";
                    toggle.title = t("showMdChannels");
                    const mdContainer = document.createElement("div");
                    mdContainer.className = "md-channels-container";
                    mdChannels.forEach(mdCh => mdContainer.appendChild(createChannelElement(mdCh)));
                    toggle.onclick = () => {
                        const isVisible = mdContainer.classList.contains("visible");
                        mdContainer.classList.toggle("visible");
                        if (!isVisible) { toggle.style.background = "var(--primary)"; toggle.style.borderColor = "var(--primary)"; }
                        else { toggle.style.background = ""; toggle.style.borderColor = ""; }
                    };
                    container.appendChild(toggle);
                    container.appendChild(mdContainer);
                }
            });
        }

        async function fetchEPG() {
            try {
                const response = await fetch("https://oepg.yasuoyone.org/epg.xml");
                if (!response.ok) throw new Error("EPG Fetch Failed");
                const json = await response.json();
                parseJSONEPG(json);
            } catch (e) { console.warn("EPG fetch failed", e); }
        }

        function parseJSONEPG(data) {
            epgData = {};
            if (data && data.schedule) {
                data.schedule.forEach(channel => {
                    const channelId = channel.channelId;
                    const channelName = channel.channelName;
                    if (!channelId) return;
                    const items = [];
                    if (channel.items) {
                        channel.items.forEach(item => {
                            const start = new Date(item.startAt);
                            const stop = new Date(item.endAt);
                            if (!isNaN(start.getTime()) && !isNaN(stop.getTime())) {
                                items.push({ start: start, stop: stop, title: item.title || "Bez názvu", desc: item.description || "" });
                            }
                        });
                    }
                    epgData[channelId] = items;
                    if (channelName) epgData[channelName] = items;
                });
            }
            updateEpgDisplay();
            if (!window.epgInterval) window.epgInterval = setInterval(updateEpgDisplay, 60000);
        }

        async function loadChannel(ch, el) {
            activeChannel = ch;
            document.querySelectorAll(".channel-item").forEach(i => i.classList.remove("active"));
            if (el) el.classList.add("active");
            document.getElementById("program-title").innerText = t("loading");
            document.getElementById("channel-name-display").innerText = ch.name;
            updateEpgDisplay();
            const shakaContainer = document.getElementById("shaka-container");
            const iframeContainer = document.getElementById("iframe-container");
            const iframe = document.getElementById("embed-player");
            if (ch.isEmbed) {
                if (window.player) await window.player.unload();
                if (shakaContainer) { shakaContainer.style.setProperty("display", "none", "important"); shakaContainer.style.visibility = "hidden"; shakaContainer.style.zIndex = "-1"; }
                if (iframeContainer && iframe) { iframeContainer.style.display = "block"; iframeContainer.style.visibility = "visible"; iframeContainer.style.zIndex = "100"; iframe.style.display = "block"; iframe.src = ch.url; }
            } else {
                if (iframeContainer && iframe) { iframeContainer.style.display = "none"; iframeContainer.style.zIndex = "-1"; iframe.src = ""; }
                if (shakaContainer) { shakaContainer.style.display = "block"; shakaContainer.style.visibility = "visible"; shakaContainer.style.zIndex = "1"; }
                try {
                    if (window.player) {
                        let audioLang = "cs";
                        if (ch.name === "Starzplay Sport 3") audioLang = "en";
                        window.player.configure({ preferredAudioLanguage: audioLang, drm: { clearKeys: {} } });
                        if (ch.drm) {
                            const kid = atob(ch.drm.k);
                            const key = atob(ch.drm.v);
                            window.player.configure({ drm: { clearKeys: { [kid]: key } } });
                        }
                        let modifiedUrl = ch.url;
                        try {
                            if (!modifiedUrl.includes('cetin.cz') && !modifiedUrl.includes('mazana.tv') && !modifiedUrl.includes('aw-ucdn')) {
                                try {
                                    const f2 = await fetch(modifiedUrl);
                                    if (f2.ok) {
                                        const t2 = await f2.text();
                                        const m = t2.match(/https?:\/\/[^/]*cetin\.cz\/[^\s"']+/);
                                        modifiedUrl = m ? m[0] : f2.url;
                                    }
                                } catch (err2) {}
                            }
                            const s = new Date(Date.now() - 3 * 3600 * 1000);
                            let uS = Math.floor(s.getTime() / 1000);
                            if (modifiedUrl.includes('cetin.cz')) {
                                let token = new URL(modifiedUrl).searchParams.get('cdntoken');
                                if (!token) {
                                    const tm = modifiedUrl.match(/\/tok_([^\/]+)\//);
                                    if (tm) token = tm[1];
                                }
                                if (token) {
                                    try {
                                        const p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                                        if (p.min_begin && uS < parseInt(p.min_begin)) uS = parseInt(p.min_begin);
                                    } catch (err) {}
                                }
                                modifiedUrl = modifiedUrl.replace(/([?&])(begin|end|from|to)=[^&]*/g, '$1').replace(/\?&/, '?').replace(/&&+/, '&').replace(/[?&]$/, '');
                                modifiedUrl += (modifiedUrl.includes('?') ? '&' : '?') + 'begin=' + uS;
                            } else if (modifiedUrl.includes('mazana.tv')) {
                                modifiedUrl = modifiedUrl.replace(/([?&])(begin|end|from|to)=[^&]*/g, '$1').replace(/\?&/, '?').replace(/&&+/, '&').replace(/[?&]$/, '');
                                modifiedUrl += (modifiedUrl.includes('?') ? '&' : '?') + 'from=' + uS;
                            } else if (modifiedUrl.includes('aw-ucdn')) {
                                const p2 = (n) => n.toString().padStart(2, '0');
                                const qs = 'begin=' + s.getUTCFullYear() + p2(s.getUTCMonth() + 1) + p2(s.getUTCDate()) + 'T' + p2(s.getUTCHours()) + p2(s.getUTCMinutes()) + p2(s.getUTCSeconds()) + 'Z';
                                modifiedUrl = modifiedUrl.replace(/([?&])(begin|end|from|to)=[^&]*/g, '$1').replace(/\?&/, '?').replace(/&&+/, '&').replace(/[?&]$/, '');
                                modifiedUrl += (modifiedUrl.includes('?') ? '&' : '?') + qs;
                            } else {
                                modifiedUrl = modifiedUrl.replace(/([?&])(begin|end|from|to)=[^&]*/g, '$1').replace(/\?&/, '?').replace(/&&+/, '&').replace(/[?&]$/, '');
                                modifiedUrl += (modifiedUrl.includes('?') ? '&' : '?') + 'begin=' + uS;
                            }
                        } catch (urlErr) {
                            console.warn('URL modifying error:', urlErr);
                        }
                        currentStreamUrl = modifiedUrl;
                        await window.player.load(modifiedUrl);
                    }
                } catch (e) { console.error(t("streamError"), e); }
            }
        }

        function updateEpgDisplay() {
            if (!activeChannel) return;
            const now = new Date();
            let currentProgram = null;
            let matchKeys = [];
            if (activeChannel.id) matchKeys.push(activeChannel.id);
            const mappedName = channelIdMapping[activeChannel.name];
            if (mappedName) matchKeys.push(mappedName);
            matchKeys.push(activeChannel.name);
            for (const key of matchKeys) {
                if (epgData[key]) {
                    currentProgram = epgData[key].find(p => p.start <= now && p.stop > now);
                    if (currentProgram) break;
                }
            }
            const titleEl = document.getElementById("program-title");
            const descEl = document.getElementById("program-desc");
            const startEl = document.getElementById("start-time");
            const endEl = document.getElementById("end-time");
            const progressEl = document.getElementById("program-progress");
            if (currentProgram) {
                titleEl.innerText = currentProgram.title;
                descEl.innerText = currentProgram.desc;
                const formatTime = d => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                startEl.innerText = formatTime(currentProgram.start);
                endEl.innerText = formatTime(currentProgram.stop);
                const total = currentProgram.stop - currentProgram.start;
                const elapsed = now - currentProgram.start;
                const percent = Math.min(100, Math.max(0, elapsed / total * 100));
                progressEl.style.width = `${percent}%`;
            } else {
                titleEl.innerText = activeChannel.name;
                descEl.innerText = t("noProgram");
                startEl.innerText = "--:--";
                endEl.innerText = "--:--";
                progressEl.style.width = "0%";
            }
        }

        function onErrorEvent(event) { console.error("Shaka Player Error:", event.detail); }
        document.addEventListener("shaka-ui-loaded", initApp);
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", e => {
            const allowed = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter", "f", "F", "m", "M"];
            if (!allowed.includes(e.key)) { e.preventDefault(); e.stopImmediatePropagation(); }
        }, true);
        setInterval(() => {
            const t = performance.now();
            debugger;
            if (performance.now() - t > 100) { document.body.innerHTML = ""; window.location.reload(); }
        }, 500);
    </script>
